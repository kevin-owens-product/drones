# Render Blueprint for the hosted demo at drones.productexec.co: the product site
# (/product/, /help/, /developers/, /why/) and the operator console (/#operate). Static build: the scripted sortie runs in the browser
# (services/ui/src/staticDemo.ts), so there is no API, database or server behind
# it, and every page says DEMO DATA.
services:
  - type: web
    runtime: static
    name: drones-demo
    rootDir: services/ui
    buildCommand: npm ci && npm run build:static
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    domains:
      - drones.productexec.co
    envVars:
      - key: NODE_VERSION
        value: "22"
    # The public site (product, help, developers) is static pages beside the console.
    # Bare "/" lands on /product/ for first-time visitors (src/main.tsx); deep links like /#operate open the console.
    routes:
      - type: redirect
        source: /product
        destination: /product/
      - type: redirect
        source: /help
        destination: /help/
      - type: redirect
        source: /developers
        destination: /developers/
      - type: redirect
        source: /why
        destination: /why/
      - type: rewrite
        source: /product/*
        destination: /product/index.html
      - type: rewrite
        source: /help/*
        destination: /help/index.html
      - type: rewrite
        source: /developers/*
        destination: /developers/index.html
      - type: rewrite
        source: /why/*
        destination: /why/index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Robots-Tag
        value: noindex, nofollow
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
