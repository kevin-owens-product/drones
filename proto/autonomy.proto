syntax = "proto3";

package a2e.autonomy.v1;

// Interface version 1.0.0. Versioning policy (docs/design/integration.md):
// - The package suffix (v1) is the major version. A breaking change (removing
//   or renumbering a field, changing a type or an rpc signature) ships as a new
//   package a2e.autonomy.v2 beside this one; v1 stays served until retired.
// - Additive changes (new optional field, new rpc, new message) bump the minor
//   version above and stay in v1.
// - A removed field's number and name are listed with `reserved` in its message
//   and are never reused. No field has been removed from v1 yet.
// - No message here may carry weapons, targeting, fire control, or payload
//   release fields (ADR 0016).
//
// Contract for FANTOM Core. This build implements it with SimRuntime.
// STUB: the government SDK is not linked. See FantomRuntime.

service AutonomyRuntime {
  rpc Load(LoadRequest) returns (Handle);
  rpc Configure(ConfigureRequest) returns (Empty);
  rpc Start(StartRequest) returns (Empty);
  rpc Stop(StopRequest) returns (Empty);
  rpc Status(Handle) returns (StatusReply);
}

message Empty {}

message Handle {
  string id = 1;
}

message LoadRequest {
  string manifest_json = 1;
}

message ConfigureRequest {
  string handle = 1;
  string config_json = 2;
}

message StartRequest {
  string handle = 1;
  string mission_state = 2;
  bool live = 3;
}

message StopRequest {
  string handle = 1;
  string reason = 2;
}

message StatusReply {
  string handle = 1;
  bool running = 2;
  bool live = 3;
  string name = 4;
  string promotion = 5;
}
