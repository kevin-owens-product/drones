syntax = "proto3";

package a2e.telemetry.v1;

option go_package = "a2e.local/gateway/internal/wire";

// Sample is one decoded MAVLink 2 message. Signed integers use zigzag (sint).
message Sample {
  uint32 system_id = 1;
  string name = 2;
  int64 received_unix_ns = 3;
  sint32 lat_e7 = 4;
  sint32 lon_e7 = 5;
  sint32 alt_mm = 6;
  float roll = 7;
  float pitch = 8;
  float yaw = 9;
  uint32 custom_mode = 10;
  uint32 base_mode = 11;
  sint32 vx_cms = 12;
  sint32 vy_cms = 13;
  sint32 vz_cms = 14;
  sint32 battery_remaining_pct = 15;
  uint32 estimator_flags = 16;
  uint32 rc_count = 17;
  uint32 voltage_mv = 18;
  float x_m = 19;
  float y_m = 20;
  float z_m = 21;
  uint32 command = 22;
  float param1 = 23;
}
