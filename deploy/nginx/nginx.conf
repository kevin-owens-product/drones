# TLS termination for any deployment that is not the laptop Compose file.
# Laptop Compose speaks HTTP on purpose. See ADR 0020.
server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:TLS_AES_256_GCM_SHA384;
  ssl_prefer_server_ciphers on;
  ssl_certificate /etc/nginx/certs/tls.crt;
  ssl_certificate_key /etc/nginx/certs/tls.key;

  add_header Strict-Transport-Security "max-age=31536000" always;

  location /metrics {
    return 404;
  }

  location / {
    proxy_pass http://api:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
  }
}
